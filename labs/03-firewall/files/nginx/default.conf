# 公開サイト: 誰でもアクセスしてよい
server {
    listen 80;
    location / {
        default_type text/plain;
        return 200 "Welcome to the public site\n";
    }
}

# 管理画面: 管理者 (admin) だけがアクセスしてよい
server {
    listen 8080;
    location / {
        default_type text/plain;
        return 200 "Admin panel - TOP SECRET\n";
    }
}
